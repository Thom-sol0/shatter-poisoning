[DATASET]
dataset_package = decentralizepy.datasets.CIFAR10
dataset_class = CIFAR10
model_class = LeNet
; correct the path to the data
train_dir = /home/pouponne/decentralized/shatter-poisoning/eval/data/CIFAR10
test_dir = /home/pouponne/decentralized/shatter-poisoning/eval/data/CIFAR10
; python list of fractions below
sizes =
random_seed = 90
partition_niid = iid
test_batch_size = 128

[OPTIMIZER_PARAMS]
optimizer_package = torch.optim
optimizer_class = SGD
lr = 0.01

[TRAIN_PARAMS]
training_package = decentralizepy.training.Training
training_class = Training
rounds = 1
full_epochs = True
batch_size = 32
shuffle = True
loss_package = torch.nn
loss_class = CrossEntropyLoss

[COMMUNICATION]
comm_package = decentralizepy.communication.TCP
comm_class = TCP
addresses_filepath = /home/pouponne/decentralized/shatter-poisoning/test_scripts/defense_filtering/CIFAR10/ip.json

[SHARING]
sharing_package = virtualNodes.sharing.VNodeSharingDefenseNormFilteringDynamic
sharing_class = VNodeSharingPoison
compress = False
attack_type = flip_grad
adversarial_nodes=9,25
tau_init = 3

[NODE]
; k in SHATTER
vnodes_per_node = 4
; Degree of the topology, each node has graph_degree neighbors
; Test other values ?
graph_degree = 4
; dynamic = True means that a new topology is generated at each round
dynamic = True
; Restricting threads per proc to reduce contention
threads_per_proc = 1
; Initial model is slightly perturbed
perturb_model = True
perturb_multiplier = 4
